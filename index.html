<html lang="en">
<head>

<title>RepFuel | Trainer–Client Fitness Platform</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b0f0d;--side:#0d110f;--card:#151a17;--card2:#191f1b;--line:#29312c;--text:#f5f7f5;--muted:#9ba39d;--lime:#a3ff12;--orange:#ff8a24;--pink:#ff65a3;--danger:#ff7272}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1a2817 0%,var(--bg) 58%)}.auth-wrap{width:min(100%,460px)}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;letter-spacing:-.8px}.brand.center{justify-content:center;margin-bottom:26px}.brand b{color:var(--lime)}.logo{width:38px;height:38px;border-radius:12px;background:var(--lime);color:#0b0f0d;display:grid;place-items:center;font-size:22px}.auth-card,.panel,.stat,.modal-card{background:var(--card);border:1px solid var(--line);border-radius:16px}.auth-card{padding:28px;box-shadow:0 25px 70px #0007}.eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--lime);font-weight:850}.auth-card h1{font-size:26px;letter-spacing:-.8px;margin:9px 0 6px}.muted{color:var(--muted)}.auth-card p{font-size:12px;line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0f1311;border:1px solid var(--line);padding:4px;border-radius:10px;margin:20px 0}.tabs button{border:0;background:transparent;color:var(--muted);padding:10px;border-radius:7px;font-weight:750}.tabs button.active{background:#29312c;color:var(--text)}label{display:block;font-size:11px;color:var(--muted);margin:13px 0 7px}input,select,textarea{width:100%;padding:11px 12px;background:#0e1210;border:1px solid var(--line);border-radius:9px;color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--lime)}.primary{background:var(--lime);color:#0b0f0d;border:0;border-radius:9px;padding:12px 15px;font-weight:850}.primary:disabled{opacity:.55;cursor:wait}.full{width:100%;margin-top:20px}.secondary{background:#202722;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 13px}.auth-message{padding:11px;border:1px solid var(--line);border-radius:9px;background:#0e1210;color:var(--muted);font-size:12px;margin-top:14px;line-height:1.5;overflow-wrap:anywhere}.auth-foot{text-align:center;font-size:10px;color:#69736c;margin:18px 0}
.app{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}aside{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:30px;min-height:100vh}.aside-brand{padding:0 9px}.nav-label{font-size:9px;letter-spacing:1.6px;color:#68726b;padding:0 11px;margin-bottom:8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:11px;border-radius:9px;font-size:12px}.nav button:hover,.nav button.active{background:#1b221d;color:var(--text)}.nav button.active{box-shadow:inset 3px 0 var(--lime)}.aside-bottom{margin-top:auto;border-top:1px solid var(--line);padding:15px 8px;color:var(--muted);font-size:11px}.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#2d3a28;color:var(--lime);font-weight:850;margin-right:8px;vertical-align:middle}.main{min-width:0;padding:25px 30px;max-width:1500px;width:100%;margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px;color:var(--muted);font-size:11px}.top-actions{display:flex;align-items:center;gap:10px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}.page-head h1{font-size:27px;letter-spacing:-.9px;margin:8px 0 5px}.page-head p{font-size:12px;margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:15px}.stat{padding:16px}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:27px;margin:11px 0 3px}.stat em{font-size:10px;color:var(--lime);font-style:normal}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.panel{padding:18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.panel h2{font-size:14px;margin:0}.panel-sub{font-size:10px;color:var(--muted);margin-top:5px}.link{border:0;background:transparent;color:var(--lime);font-size:11px}.chart{height:170px;display:flex;align-items:end;gap:12px;padding:10px 8px 23px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 39px,#27302a 40px)}.chart-col{height:100%;flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:7px}.bar{width:min(30px,80%);background:#40523a;border-radius:5px 5px 1px 1px}.bar.current{background:var(--lime)}.chart-col small{font-size:9px;color:var(--muted)}.client-row,.activity-row,.exercise-row,.schedule-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #252d28}.client-row:last-child,.activity-row:last-child,.exercise-row:last-child,.schedule-row:last-child{border:0}.client-info{flex:1;min-width:0}.client-info strong,.schedule-row strong{font-size:11px;display:block}.client-info small,.schedule-row small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.pill{display:inline-block;border-radius:30px;padding:5px 8px;font-size:9px;background:#20301b;color:var(--lime);white-space:nowrap}.pill.orange{background:#352617;color:#ffb46d}.pill.pink{background:#382333;color:#ff9bc2}.pill.gray{background:#272d29;color:#b6beb8}.table-wrap{overflow:auto}.data-table{border-collapse:collapse;width:100%;text-align:left;min-width:530px}.data-table th{font-size:9px;color:#778079;padding:0 9px 11px}.data-table td{font-size:11px;padding:12px 9px;border-top:1px solid #252d28}.search{max-width:210px}.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:12px}.notice{background:#121713;border:1px dashed #39443b;padding:12px;border-radius:10px;color:var(--muted);font-size:11px;line-height:1.6;margin-top:14px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.program-day{border:1px solid var(--line);background:#111512;border-radius:10px;padding:12px;margin-bottom:9px}.program-day strong{font-size:12px}.tag{font-size:9px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:18px;z-index:10}.modal-card{width:min(100%,540px);padding:22px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.modal-head h2{font-size:17px;margin:0}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.role-switch{display:flex;gap:8px}.client-home{max-width:850px}.client-accent{--accent:var(--orange)}.client-accent.female{--accent:var(--pink)}.client-accent .eyebrow,.client-accent .link{color:var(--accent)}.client-accent .primary{background:var(--accent)}.client-accent .nav button.active{box-shadow:inset 3px 0 var(--accent)}.foot{text-align:center;color:#657068;font-size:9px;margin:20px}
@media(max-width:950px){.app{grid-template-columns:190px 1fr}.main{padding:22px 18px}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:620px){.app{display:block}aside{min-height:auto;position:sticky;top:0;z-index:5;padding:10px;gap:10px}.aside-brand{padding:0 4px}.aside-brand .brand{font-size:19px}.aside-brand .logo{width:30px;height:30px;font-size:18px}.nav-label,.aside-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.main{padding:17px 12px}.topbar{margin-bottom:20px}.page-head{align-items:start;flex-direction:column}.page-head h1{font-size:23px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.panel{padding:14px}.field-row,.two-col{grid-template-columns:1fr}.top-actions .primary{padding:9px}.search{max-width:140px}}
</style>

<body>
<div id="authPage" class="auth-page">
 <div class="auth-wrap">
  <div class="brand center"><span class="logo">R</span>Rep<b>Fuel</b></div>
  <section class="auth-card">
   <div class="eyebrow">TRAINER–CLIENT FITNESS PLATFORM</div>
   <h1 id="authTitle">Welcome back</h1>
   <p class="muted" id="authDesc">Sign in to manage training or complete your assigned workout.</p>
   <div class="tabs"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Create account</button></div>
   <form id="authForm">
    <div id="nameField" class="hidden"><label for="fullName">Full name</label><input id="fullName" autocomplete="name" placeholder="Your full name"></div>
    <div id="usernameField" class="hidden"><label for="username">Account name / username</label><input id="username" placeholder="e.g. om_behera"></div>
    <div id="roleField" class="hidden"><label for="role">I am a</label><select id="role"><option value="client">Client</option><option value="trainer">Trainer</option></select></div>
    <div id="clientFields" class="hidden">
      <div class="field-row"><div><label for="age">Age</label><input id="age" type="number" min="13" max="110" placeholder="Age"></div><div><label for="height">Height (cm)</label><input id="height" type="number" min="1" step=".1" placeholder="Height"></div></div>
      <label for="weight">Weight (kg)</label><input id="weight" type="number" min="1" step=".1" placeholder="Weight">
      <label for="trainerCode">Trainer ID</label><input id="trainerCode" placeholder="Enter your trainer's ID">
    </div>
    <label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required>
    <button id="submitBtn" class="primary full" type="submit">Login</button>
   </form>
   <div id="authMessage" class="auth-message hidden" role="status"></div>
  </section>
  <div class="auth-foot">RepFuel · Trainer prescribes → Client executes → System records → Trainer monitors</div>
 </div>
</div>
<div id="app" class="app hidden">
 <aside>
  <div class="aside-brand"><div class="brand"><span class="logo">R</span>Rep<b>Fuel</b></div></div>
  <div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav"></nav></div>
  <div class="aside-bottom"><span class="avatar" id="userAvatar">U</span><b id="userName" style="color:var(--text)">Account</b><div id="userRole" style="margin:5px 0 0 43px">Workspace</div><button class="link" id="logoutBtn" style="margin:12px 0 0 42px">Log out</button></div>
 </aside>
 <main class="main" id="mainContent"></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Create</h2><button class="close" id="closeModal" aria-label="Close">×</button></div><div id="modalBody"></div></div></div>
<script>
/* Add your Supabase Project URL and Publishable key below. Never use a secret/service-role key here. */
const SUPABASE_URL = "https://cthtagxotlcxbrmcrfjk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_L282wjp9MPblzCJv5B0CqA_-TUsPO-H";
const SUPABASE_CONFIGURED = !SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_PUBLISHABLE_KEY.startsWith("YOUR_");
const sb = SUPABASE_CONFIGURED && window.supabase ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY) : null;
const $=id=>document.getElementById(id);
let mode="login",currentUser=null,currentRole="trainer",activePage="Overview";
const demoClients=[{name:"Arjun Sharma",username:"arjun_s",detail:"Age 27 · 178 cm · 78 kg",program:"Hypertrophy Phase 1",status:"Active",color:""},{name:"Priya Mehta",username:"priya_m",detail:"Age 25 · 165 cm · 61 kg",program:"Strength Foundation",status:"Active",color:"pink"},{name:"Rahul Kumar",username:"rahul_k",detail:"Age 31 · 172 cm · 84 kg",program:"Fat Loss Block",status:"Active",color:"orange"},{name:"Sneha Nair",username:"sneha_n",detail:"Age 24 · 160 cm · 56 kg",program:"Full Body Base",status:"Inactive",color:""}];
const exercises=["Barbell Bench Press","Incline Dumbbell Press","Squat","Romanian Deadlift","Lat Pulldown","Seated Cable Row","Shoulder Press","Lateral Raise","Bicep Curl","Triceps Pushdown","Leg Extension","Leg Curl","Calf Raise"];
function showMsg(t){$("authMessage").textContent=t;$("authMessage").classList.remove("hidden")}
function setMode(m){mode=m;const signup=m==="signup";$("loginTab").classList.toggle("active",!signup);$("signupTab").classList.toggle("active",signup);["nameField","usernameField","roleField"].forEach(id=>$(id).classList.toggle("hidden",!signup));$("fullName").required=signup;$("username").required=signup;$("clientFields").classList.toggle("hidden",!signup||$("role").value!=="client");$("authTitle").textContent=signup?"Create your account":"Welcome back";$("authDesc").textContent=signup?"Register as a trainer or join your trainer using their Trainer ID.":"Sign in to manage training or complete your assigned workout.";$("submitBtn").textContent=signup?"Create account":"Login";$("authMessage").classList.add("hidden")}
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");$("role").onchange=()=>$("clientFields").classList.toggle("hidden",$("role").value!=="client");
function enterApp(user){currentUser=user;currentRole=(user.user_metadata?.role||"trainer")==="client"?"client":"trainer";$("authPage").classList.add("hidden");$("app").classList.remove("hidden");$("userName").textContent=user.user_metadata?.full_name||user.email?.split("@")[0]||"Account";$("userRole").textContent=currentRole==="trainer"?"Trainer workspace":"Client workspace";$("userAvatar").textContent=($("userName").textContent.trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2)||"U").toUpperCase();$("app").classList.toggle("client-accent",currentRole==="client");$("app").classList.toggle("female",currentRole==="client"&&user.user_metadata?.theme==="female");renderNav();renderPage("Overview")}
function renderNav(){const items=currentRole==="trainer"?[["Overview","◫"],["Clients","♙"],["Workout Programs","▤"],["Exercise Library","✣"],["Schedule","▦"],["Attendance","✓"],["Progress","↗"]]:[["Today's Workout","◉"],["My Program","▤"],["Workout History","◷"],["My Progress","↗"],["My Trainer","♙"]];$("nav").innerHTML=items.map(([name,icon])=>`<button data-page="${name}" class="${activePage===name?"active":""}">${icon} &nbsp; ${name}</button>`).join("");$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>renderPage(b.dataset.page))}
function panel(title,sub,body,action=""){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2>${sub?`<div class="panel-sub">${sub}</div>`:""}</div>${action}</div>${body}</section>`}
function stat(label,value,detail){return `<div class="stat"><small>${label}</small><strong>${value}</strong><em>${detail}</em></div>`}
function clientRows(){return demoClients.map((c,i)=>`<div class="client-row"><span class="avatar ${c.color}" style="${c.color==="orange"?"background:#352617;color:#ffb46d":c.color==="pink"?"background:#382333;color:#ff9bc2":""}">${c.name.split(" ").map(x=>x[0]).join("")}</span><div class="client-info"><strong>${c.name}</strong><small>@${c.username} · ${c.program}</small></div><span class="pill ${c.status==="Inactive"?"gray":""}">${c.status}</span><button class="link" data-client="${i}">View</button></div>`).join("")}

async function loadClients() {
  const list = $("clientList");
  if (!list || !currentUser || !sb) return;

  list.innerHTML = '<p class="muted">Loading clients...</p>';

  const { data: clients, error } = await sb
    .from("clients")
    .select("id, trainer_id, current_weight_kg")
    .eq("trainer_id", currentUser.id);

  if (error) {
    list.innerHTML = `<p class="muted">Could not load clients: ${esc(error.message)}</p>`;
    return;
  }

  if (!clients || clients.length === 0) {
    list.innerHTML = '<p class="muted">No registered clients yet.</p>';
    return;
  }

  const ids = clients.map(client => client.id);

  const { data: profiles, error: profileError } = await sb
    .from("profiles")
    .select("id, full_name")
    .in("id", ids);

  if (profileError) {
    list.innerHTML = `<p class="muted">Could not load client profiles: ${esc(profileError.message)}</p>`;
    return;
  }

  const names = new Map(
    (profiles || []).map(profile => [profile.id, profile.full_name])
  );

  list.innerHTML = clients.map(client => {
    const name = names.get(client.id) || "Client";
    const initials = name.trim().split(/\s+/)
      .map(part => part[0]).join("").slice(0, 2).toUpperCase();

    return `<div class="client-row">
      <span class="avatar">${esc(initials)}</span>
      <div class="client-info">
        <strong>${esc(name)}</strong>
        <small>Registered client</small>
      </div>
      <span class="pill">Active</span>
    </div>`;
  }).join("");
} 
function dashboard(){return `<div class="topbar"><span>Workspace / <b style="color:var(--text)">Overview</b></span><div class="top-actions"><span>${new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}</span><button class="primary" id="newProgram">＋ New program</button></div></div><div class="page-head"><div><div class="eyebrow">TRAINER DASHBOARD</div><h1>Welcome, ${esc($("userName").textContent)} ✦</h1><p>Manage your clients, prescribe workouts and monitor progress.</p></div><span class="pill">● Workspace active</span></div><div class="stats">${stat("Total clients","—","Connect database to load")}${stat("Active programs","—","Live data pending")}${stat("Today's sessions","—","Live data pending")}${stat("Attendance","—","Live data pending")}</div><div class="grid2">${panel("Workout activity","Client sessions will appear here",`<div class="chart">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>`<div class="chart-col"><div class="bar ${i===6?"current":""}" style="height:${[54,72,62,84,66,94,38][i]}%"></div><small>${d}</small></div>`).join("")}</div>`)}${panel("Client overview","Sample layout · not live data",clientRows())}</div><div class="grid2" style="margin-top:14px">${panel("Recent workout sessions","Live records will appear after database integration",`<div class="empty">No workout sessions loaded yet.</div>`)}${panel("Today's schedule","Trainer appointments",`<div class="empty">No appointments loaded yet.</div>`)}</div><div class="notice">This is the application UI foundation. The numbers and sample client list are illustrative only. Next we connect secure database operations and replace these placeholders with real records.</div>`}
function clientsPage(){return `<div class="topbar">Workspace / <b style="color:var(--text)">Clients</b><span></span></div><div class="page-head"><div><div class="eyebrow">CLIENT MANAGEMENT</div><h1>Clients</h1><p>Manage your roster and open individual client profiles.</p></div><button class="primary" id="addClient">＋ Add client</button></div>${panel("Your client roster","Sample entries only",`<div class="panel-head"><input class="search" id="clientSearch" placeholder="Search clients…"></div><div id="clientList">${clientRows()}</div>`)}<div class="notice">Client creation will be connected to the Trainer ID registration flow after database permissions are verified.</div>`}
function programsPage(){return `<div class="topbar">Workspace / <b style="color:var(--text)">Workout Programs</b></div><div class="page-head"><div><div class="eyebrow">PROGRAMMING</div><h1>Workout programs</h1><p>Create trainer-prescribed plans with days, exercises, sets and targets.</p></div><button class="primary" id="newProgram">＋ New program</button></div>${panel("Program builder","UI preview · saving will be enabled after database integration",`<div class="empty">No programs connected yet.</div><div class="program-day"><strong>Example: Hypertrophy Phase 1</strong><p class="tag">8 weeks · 6 training days · Example only</p><div class="exercise-row"><div class="client-info"><strong>Monday — Push</strong><small>Incline Dumbbell Press · 4 sets · 8–12 reps · 30 kg · 120 sec rest</small></div></div><div class="exercise-row"><div class="client-info"><strong>Shoulder Press</strong><small>3 sets · 8–10 reps · 90 sec rest</small></div></div><div class="exercise-row"><div class="client-info"><strong>Lateral Raise</strong><small>4 sets · 12–15 reps · 60 sec rest</small></div></div></div>`)}<div class="notice">Program changes must be trainer-controlled. Clients will be able to record actual performance without editing prescribed targets.</div>`}
function exercisesPage(){return `<div class="topbar">Workspace / <b style="color:var(--text)">Exercise Library</b></div><div class="page-head"><div><div class="eyebrow">EXERCISE DATABASE</div><h1>Exercise library</h1><p>Search the exercise catalogue for your programs.</p></div></div>${panel("Exercises","Starter catalogue",`<input id="exerciseSearch" class="search" placeholder="Search exercises…" style="margin-bottom:12px"><div id="exerciseList">${exercises.map(e=>`<div class="exercise-row"><span class="avatar">✣</span><div class="client-info"><strong>${e}</strong><small>Exercise details and media will be added to the database.</small></div></div>`).join("")}</div>`)}`}
function genericPage(name){let copy={"Schedule":"Manage client appointments, training sessions, rest days and rescheduled sessions.","Attendance":"Record attendance separately from workout completion.","Progress":"Review body metrics, exercise performance and personal records.","Today's Workout":"View your assigned workout, then record each set in sequence.","My Program":"View the program prescribed by your trainer.","Workout History":"Review completed workouts and historical performance.","My Progress":"Track your body metrics and strength progression.","My Trainer":"View your assigned trainer and training information."};return `<div class="topbar">Workspace / <b style="color:var(--text)">${name}</b></div><div class="page-head"><div><div class="eyebrow">${currentRole==="trainer"?"TRAINER WORKSPACE":"CLIENT WORKSPACE"}</div><h1>${name}</h1><p>${copy[name]||"Your fitness workspace."}</p></div></div>${panel(name,"Feature setup in progress",`<div class="empty">This section is ready for the next development phase. No live records are connected yet.</div>`)}<div class="notice">The platform will preserve the core workflow: trainer prescribes → client executes → system records → trainer monitors.</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function renderPage(name) {
  activePage = name;
  renderNav();

  $("mainContent").innerHTML =
    currentRole === "trainer"
      ? name === "Overview"
        ? dashboard()
        : name === "Clients"
          ? clientsPage()
          : name === "Workout Programs"
            ? programsPage()
            : name === "Exercise Library"
              ? exercisesPage()
              : genericPage(name)
      : genericPage(name);

  $("mainContent").querySelectorAll("[data-client]")
    .forEach(b => b.onclick = () =>
      openClient(Number(b.dataset.client))
    );

  const np = $("newProgram");
  if (np) np.onclick = openProgramModal;

  const ac = $("addClient");
  if (ac) ac.onclick = () =>
    showModal(
      "Add client",
      `<p class="muted">
        Clients must register with a valid Trainer ID.
        Ask your client to register using your trainer code.
      </p>
      <button class="primary" onclick="closeModal()">Got it</button>`
    );

  const cs = $("clientSearch");
  if (cs) {
    cs.oninput = () => {
      $("clientList").querySelectorAll(".client-row")
        .forEach(r => {
          r.style.display = r.textContent
            .toLowerCase()
            .includes(cs.value.toLowerCase()) ? "" : "none";
        });
    };
  }

  const es = $("exerciseSearch");
  if (es) {
    es.oninput = () => {
      $("exerciseList").querySelectorAll(".exercise-row")
        .forEach(r => {
          r.style.display = r.textContent
            .toLowerCase()
            .includes(es.value.toLowerCase()) ? "" : "none";
        });
    };
  }

  if (name === "Clients" && currentRole === "trainer") {
    loadClients();
  }
}
function showModal(title,body){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden")}
$("closeModal").onclick=closeModal;$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};
function openClient(i){const c=demoClients[i];showModal("Client profile",`<div class="client-row"><span class="avatar">${c.name.split(" ").map(x=>x[0]).join("")}</span><div class="client-info"><strong>${c.name}</strong><small>@${c.username}</small></div><span class="pill">${c.status}</span></div><p class="muted">${c.detail}</p><p><b>Current program:</b> ${c.program}</p><div class="notice">This is a sample profile. Real client records will be loaded from Supabase after secure ownership policies are tested.</div>`)}
function openProgramModal(){showModal("Create workout program",`<form id="programForm"><label>Program name</label><input required placeholder="e.g. Hypertrophy Phase 1"><div class="field-row"><div><label>Duration (weeks)</label><input type="number" min="1" placeholder="8"></div><div><label>Assign to client</label><select><option>Select client</option>${demoClients.map(c=>`<option>${c.name}</option>`).join("")}</select></div></div><label>Description</label><textarea rows="3" placeholder="Program goals and notes"></textarea><div class="notice">This form is a UI preview and does not save yet. Database write operations will be added after schema and RLS verification.</div><button class="primary full" type="submit">Preview program</button></form>`);$("programForm").onsubmit=e=>{e.preventDefault();showModal("Program preview",`<p class="muted">Your program details are ready for the next build phase. Saving is not enabled yet.</p><button class="primary" onclick="closeModal()">Close</button>`)}}
$("authForm").onsubmit=async e=>{e.preventDefault();if(!SUPABASE_CONFIGURED){showMsg("Supabase is not configured. Edit index.html and replace the Project URL and Publishable Key placeholders.");return}if(!sb){showMsg("Supabase client could not load. Check your internet connection and reload.");return}const email=$("email").value.trim(),password=$("password").value;$("submitBtn").disabled=true;try{if(mode==="signup"){const role=$("role").value,meta={full_name:$("fullName").value.trim(),account_name:$("username").value.trim(),role};if(role==="client"){meta.age=Number($("age").value);meta.height_cm=Number($("height").value);meta.weight_kg=Number($("weight").value);meta.trainer_code=$("trainerCode").value.trim()}if(!meta.full_name||!meta.account_name)throw Error("Enter your full name and account name.");if(role==="client"&&(!meta.age||!meta.height_cm||!meta.weight_kg||!meta.trainer_code))throw Error("Complete all client fields, including Trainer ID.");const {data,error}=await sb.auth.signUp({email,password,options:{data:meta}});if(error)throw error;if(data.session&&data.user)enterApp(data.user);else showMsg("Account created. Check your email to confirm your account, then log in. Note: trainer-code validation and profile creation must be enabled in the backend before client registration is production-ready.")}else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;if(data.user)enterApp(data.user)}}catch(err){showMsg(err.message||"Authentication failed.")}finally{$("submitBtn").disabled=false}};
$("logoutBtn").onclick=async()=>{if(sb)await sb.auth.signOut();currentUser=null;$("app").classList.add("hidden");$("authPage").classList.remove("hidden");setMode("login")};
if(sb){sb.auth.getSession().then(({data,error})=>{if(!error&&data.session)enterApp(data.session.user)});sb.auth.onAuthStateChange((_event,session)=>{if(session&&$("authPage").classList.contains("hidden"))currentUser=session.user})}
setMode("login");
</script>
